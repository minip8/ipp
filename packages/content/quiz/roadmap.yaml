# The quiz roadmap: per topic, the study areas drawn as a graph on the Quizzes page.
#
# Each node groups one or more question subtopics (the exact `subtopic` strings of the questions)
# and `requires` the nodes of the same topic worth learning first. Prerequisites are advice; the
# site never locks a node. Keep each graph readable: direct prerequisites only (leave out what
# follows from them), and a title short enough for a node (28 characters at most).
#
# `related` links a node to nodes of *other* topics that go with it: background it leans on, or the
# same ground seen from another side (C++ concurrency and the Concurrency topic's atomics). Write a
# link on one of its two nodes; the site lists it on both, under "Related in other topics". It
# draws no edge and never affects what is "next up". Keep these few: only links a learner would
# be glad to be told about.
#
# Every subtopic used by a question must be on exactly one node of its topic, and every subtopic
# listed here must have questions: `pnpm --filter @ipp/content check` and the content tests fail
# otherwise. So a question with a new subtopic needs a place here before it ships.

cpp:
  - id: cpp-initialization
    title: Initialization
    description: The many forms of initialization, what each one does, and the defaults you get.
    subtopics: [Initialization]
  - id: cpp-conversions
    title: Conversions and const
    description: Integer promotions, implicit conversions and where const really applies.
    subtopics: [Integer promotions and conversions, const-correctness]
  - id: cpp-object-lifetime
    title: Object lifetime
    description: Construction, destruction, RAII and the special member functions.
    subtopics: [Object lifetime and special member functions]
    requires: [cpp-initialization]
  - id: cpp-undefined-behaviour
    title: Undefined behaviour
    description: What the standard leaves undefined or unspecified, and how it bites.
    subtopics: [Undefined and unspecified behaviour]
    requires: [cpp-initialization, cpp-conversions]
  - id: cpp-overloading
    title: Overloading and lookup
    description: How a call picks its function, from name lookup to overload ranking.
    subtopics: [Overload resolution and name lookup]
    requires: [cpp-conversions]
  - id: cpp-move-semantics
    title: Move semantics
    description: Value categories, rvalue references, std::move and what a moved-from object is.
    subtopics: [Value categories and move semantics]
    requires: [cpp-object-lifetime]
  - id: cpp-virtual-dispatch
    title: Virtual dispatch
    description: Inheritance, vtables, slicing and the object model behind them.
    subtopics: [Virtual dispatch and the object model]
    requires: [cpp-object-lifetime]
  - id: cpp-templates
    title: Templates and constexpr
    description: Deduction, SFINAE, concepts and evaluating code at compile time.
    subtopics: ["Templates, deduction, SFINAE and concepts", constexpr and compile-time evaluation]
    requires: [cpp-overloading]
  - id: cpp-build-model
    title: Build model and ODR
    description: Translation units, linkage, the One Definition Rule and what the linker sees.
    subtopics: ["Build model, ODR and linkage"]
    requires: [cpp-overloading]
    related: [os-linking]
  - id: cpp-ownership
    title: Ownership and exceptions
    description: Smart pointers, who owns what, and code that stays correct when something throws.
    subtopics: [Smart pointers and ownership, Exceptions and noexcept]
    requires: [cpp-move-semantics]
  - id: cpp-containers
    title: Containers and strings
    description: Standard containers, iterator invalidation, std::string and string_view.
    subtopics: [Containers and iterators, Strings and string_view]
    requires: [cpp-move-semantics, cpp-templates]
  - id: cpp-lambdas-algorithms
    title: Lambdas and algorithms
    description: Closures and captures, the standard algorithms and ranges.
    subtopics: [Lambdas and closures, Algorithms and ranges]
    requires: [cpp-containers]
  - id: cpp-modern
    title: Modern C++
    description: What C++17, C++20 and C++23 added, from optional and variant to coroutines.
    subtopics: ["C++17, C++20 and C++23 features"]
    requires: [cpp-containers]
  - id: cpp-memory-performance
    title: Memory and performance
    description: Alignment, allocation and the idioms that make C++ fast.
    subtopics: ["Memory, alignment and allocation", Performance idioms]
    requires: [cpp-ownership, cpp-containers]
    related: [ca-caches, os-allocators]
  - id: cpp-concurrency
    title: Concurrency
    description: Threads, atomics and the C++ memory model.
    subtopics: [Concurrency and the memory model]
    requires: [cpp-undefined-behaviour, cpp-lambdas-algorithms]
    related: [cc-races, cc-atomics, cc-memory-ordering]

python:
  - id: py-numbers-strings
    title: Numbers and strings
    description: Integers, floats, text and bytes, and the surprises in each.
    subtopics: [Numbers, Strings and bytes]
  - id: py-scope-imports
    title: Scope and imports
    description: How names are bound and looked up, and how modules and packages are loaded.
    subtopics: [Names and scope, Import system, Modules, Packages]
  - id: py-mutability
    title: Mutability and identity
    description: Names as references, aliasing, copying, and is versus ==.
    subtopics: [Mutability and aliasing, Identity and equality, Copying]
  - id: py-functions
    title: Functions and closures
    description: Parameters, default arguments, closures, late binding and decorators.
    subtopics: [Functions, Parameters, Default arguments, Closures and late binding, Decorators]
    requires: [py-scope-imports, py-mutability]
  - id: py-containers
    title: Containers and hashing
    description: Lists, dicts and sets, what makes a key hashable, and what operations cost.
    subtopics: [Containers, Dicts, Hashing and ordering, Complexity]
    requires: [py-numbers-strings, py-mutability]
  - id: py-iteration
    title: Iterators and generators
    description: The iteration protocol, generators and comprehensions.
    subtopics: [Iteration protocol, Iterators, Generators, Comprehensions]
    requires: [py-functions, py-containers]
  - id: py-classes
    title: Classes
    description: Class and instance attributes, inheritance and the MRO, ABCs and dataclasses.
    subtopics: [Class and instance attributes, MRO and super, Abstract base classes, Dataclasses]
    requires: [py-functions]
  - id: py-exceptions
    title: Exceptions
    description: Raising and handling, chaining, exception groups and context managers.
    subtopics: [Exceptions, Exception chaining, Exception groups, Context managers]
    requires: [py-functions]
  - id: py-data-model
    title: Data model
    description: Special methods, operator dispatch, attribute access and object creation.
    subtopics: [Data model, Operator dispatch, Attribute access, Object creation]
    requires: [py-classes]
  - id: py-stdlib
    title: Standard library
    description: collections, functools, itertools, heapq, bisect and sorting.
    subtopics: [collections, functools, itertools, heapq, bisect, Sorting, Performance]
    requires: [py-iteration]
  - id: py-concurrency
    title: Concurrency and asyncio
    description: The GIL, threads, processes, free-threading and asyncio.
    subtopics: [GIL, Threading, Multiprocessing, Free-threading, Concurrency models, asyncio]
    requires: [py-iteration, py-exceptions]
    related: [cc-python, cc-asyncio]
  - id: py-typing
    title: Type hints
    description: Annotations, generics and variance, and protocols.
    subtopics: [Type hints, Annotations, Generics and variance, Protocols]
    requires: [py-classes]
  - id: py-descriptors
    title: Descriptors and metaclasses
    description: Properties, bound methods, __slots__, descriptors and how classes are made.
    subtopics: [Descriptors, Properties, Bound methods, __slots__, Metaclasses, Class creation]
    requires: [py-data-model]
  - id: py-memory
    title: Memory and GC
    description: Reference counting, the cycle collector and weak references.
    subtopics: [Memory management, Garbage collection, Weak references]
    requires: [py-data-model]

computer-architecture:
  - id: ca-data-representation
    title: Data representation
    description: Integers, two's complement, floating point, endianness and layout in memory.
    subtopics: [Data representation]
  - id: ca-latency-numbers
    title: Latency numbers
    description: The orders of magnitude every engineer should know, from a register to a disk.
    subtopics: [Numbers every engineer should know]
  - id: ca-instruction-sets
    title: Instruction sets
    description: What an ISA defines, and how calling conventions pass arguments and results.
    subtopics: [Instruction sets and calling conventions]
    requires: [ca-data-representation]
  - id: ca-memory-hierarchy
    title: Memory hierarchy
    description: Registers to DRAM, virtual memory and TLBs, and memory bandwidth.
    subtopics: [Memory hierarchy and TLBs, DRAM and bandwidth]
    requires: [ca-latency-numbers]
  - id: ca-pipelines
    title: Pipelines and branches
    description: Pipelining, hazards and how branch prediction keeps the pipeline full.
    subtopics: [Pipelining and hazards, Branch prediction]
    requires: [ca-instruction-sets]
  - id: ca-simd
    title: SIMD
    description: Vector instructions, and writing code the compiler can vectorise.
    subtopics: [SIMD]
    requires: [ca-instruction-sets]
  - id: ca-caches
    title: Caches
    description: Lines, associativity, replacement, write policies and access patterns.
    subtopics: [Caches]
    requires: [ca-memory-hierarchy]
  - id: ca-storage
    title: Storage and I/O
    description: SSDs, disks, DMA and the cost of getting data in and out.
    subtopics: [Storage and I/O]
    requires: [ca-memory-hierarchy]
  - id: ca-out-of-order
    title: Out-of-order execution
    description: Instruction-level parallelism, reordering and speculative execution.
    subtopics: [Out-of-order and speculative execution, Instruction-level parallelism]
    requires: [ca-pipelines]
  - id: ca-multicore
    title: Multicore, SMT and NUMA
    description: Many cores, hardware threads, and memory that is nearer to some cores.
    subtopics: [Multicore and SMT, NUMA]
    requires: [ca-caches]
  - id: ca-coherence
    title: Coherence and ordering
    description: Keeping caches coherent, and the memory orderings hardware provides.
    subtopics: [Cache coherence and memory ordering]
    requires: [ca-multicore]
  - id: ca-performance
    title: Performance analysis
    description: Measuring, profiling and reasoning about where the time goes.
    subtopics: [Performance analysis]
    requires: [ca-out-of-order, ca-caches]

operating-systems:
  - id: os-kernel
    title: Kernel and system calls
    description: User and kernel mode, system calls, interrupts and how a machine boots.
    subtopics: [System calls, Interrupts and exceptions, Booting, I/O devices and drivers]
  - id: os-processes
    title: Processes and threads
    description: What a process and a thread are, and a process's life from start to exit.
    subtopics: [Processes and threads, Process lifecycle]
    requires: [os-kernel]
  - id: os-virtual-memory
    title: Virtual memory
    description: Address spaces, paging, page faults, mmap, overcommit and the OOM killer.
    subtopics: [Virtual memory, Overcommit and OOM]
    requires: [os-kernel]
    related: [ca-memory-hierarchy]
  - id: os-process-control
    title: fork, exec and signals
    description: Creating processes with copy-on-write, replacing their image, and signals.
    subtopics: [fork and exec, Signals, Signals and system calls]
    requires: [os-processes, os-virtual-memory]
  - id: os-files
    title: File descriptors and I/O
    description: A process's descriptors, reads and writes, buffering and non-blocking I/O.
    subtopics: [File descriptors and I/O]
    requires: [os-processes]
  - id: os-scheduling
    title: Scheduling
    description: How the scheduler shares the CPUs, real-time policies and tuning for latency.
    subtopics: [Scheduling, Real-time scheduling, Low-latency tuning]
    requires: [os-processes]
  - id: os-allocators
    title: Memory allocators
    description: malloc and free, fragmentation, and allocators built on the virtual memory system.
    subtopics: [Memory allocators]
    requires: [os-virtual-memory]
  - id: os-ipc
    title: IPC and kernel locks
    description: Pipes, shared memory and sockets between processes, and locking in the kernel.
    subtopics: [IPC, Kernel synchronization and deadlock]
    requires: [os-process-control, os-files]
  - id: os-file-systems
    title: File systems
    description: Inodes, directories, links, the page cache and keeping data durable.
    subtopics: [File systems]
    requires: [os-files]
  - id: os-linking
    title: Linking and loading
    description: Static and dynamic linking, and how exec turns a file into a running program.
    subtopics: [Linking and loading]
    requires: [os-process-control]
  - id: os-containers
    title: Containers and VMs
    description: Namespaces, cgroups and what separates a container from a virtual machine.
    subtopics: [Containers and virtualization]
    requires: [os-file-systems]
  - id: os-practical-linux
    title: Practical Linux
    description: Finding out what a live system is doing, with the tools at hand.
    subtopics: [Practical Linux]
    requires: [os-ipc]

concurrency:
  - id: cc-threads
    title: Threads and processes
    description: Concurrency versus parallelism, a thread's life, and what limits scaling.
    subtopics: [Threads and processes, Concurrency vs parallelism, Thread lifecycle, Thread-local storage]
    related: [os-processes]
  - id: cc-races
    title: Races and thread safety
    description: Data races and race conditions, critical sections and what thread-safe means.
    subtopics: [Data races, Races, Critical sections, Thread safety, Signals and reentrancy, Testing concurrent code]
    requires: [cc-threads]
  - id: cc-mutexes
    title: Mutexes and locks
    description: Mutexes, spinlocks, reader-writer locks, one-time initialisation and priority inversion.
    subtopics: [Mutexes, Spinlocks, Reader-writer locks, One-time initialisation, Priority inversion]
    requires: [cc-races]
  - id: cc-atomics
    title: Atomics and CAS
    description: Atomic operations, compare-and-swap, and why volatile is not one of them.
    subtopics: [Atomics, Compare-and-swap, volatile]
    requires: [cc-races]
  - id: cc-python
    title: Python threads and the GIL
    description: What the GIL does and does not protect, threads and processes in Python.
    subtopics: [Python GIL, Python threading, Python concurrency models, Processes]
    requires: [cc-races]
  - id: cc-deadlock
    title: Deadlock and liveness
    description: The conditions for deadlock, avoiding it, and livelock and starvation.
    subtopics: [Deadlock, Livelock and starvation]
    requires: [cc-mutexes]
  - id: cc-condition-variables
    title: Condition variables
    description: Waiting for a condition, monitors, semaphores, latches and barriers.
    subtopics: [Condition variables, Monitors, Semaphores, Latches and barriers]
    requires: [cc-mutexes]
  - id: cc-memory-ordering
    title: Memory ordering
    description: Happens-before, acquire and release, fences and hardware memory models.
    subtopics: [Memory ordering, Happens-before, Fences, Hardware memory models, Java memory model]
    requires: [cc-atomics]
    related: [ca-coherence]
  - id: cc-classic-problems
    title: Classic problems
    description: Producer-consumer, readers-writers and the dining philosophers.
    subtopics: [Producer-consumer, Readers-writers, Dining philosophers]
    requires: [cc-condition-variables, cc-deadlock]
  - id: cc-pools-futures
    title: Pools and futures
    description: Thread pools, work stealing, futures and promises.
    subtopics: [Thread pools, Work stealing, Futures and async]
    requires: [cc-condition-variables]
  - id: cc-lock-free
    title: Lock-free structures
    description: Progress guarantees, ring buffers, ABA, memory reclamation, RCU and seqlocks.
    subtopics: [Lock-free structures, Progress guarantees, Ring buffers, ABA problem, Memory reclamation, RCU, Seqlocks, Correctness criteria, Lock-free performance]
    requires: [cc-memory-ordering]
  - id: cc-scaling
    title: Scaling and contention
    description: Amdahl's law, contended locks and atomics, false sharing and cache coherence.
    subtopics: [Scaling, Contention, False sharing, Cache coherence]
    requires: [cc-mutexes, cc-atomics]
    related: [ca-caches, ca-coherence]
  - id: cc-event-loops
    title: Event loops and coroutines
    description: Event loops, green threads and coroutines, and when they beat threads.
    subtopics: [Event loops, Coroutines]
    requires: [cc-pools-futures]
    related: [net-sockets]
  - id: cc-asyncio
    title: asyncio
    description: Tasks, cancellation and the traps of Python's event loop.
    subtopics: [asyncio]
    requires: [cc-event-loops]

networking:
  - id: net-link-layer
    title: Layers and Ethernet
    description: The layered model, Ethernet frames, switching, ARP and VLANs.
    subtopics: [Layered model, Ethernet and switching, ARP, VLANs]
  - id: net-ip
    title: IP and subnetting
    description: IPv4 and IPv6 addresses, prefixes and subnet arithmetic.
    subtopics: [IP addressing, Subnetting, IPv6]
    requires: [net-link-layer]
  - id: net-routing
    title: Routing and NAT
    description: How routers forward packets, ICMP and path MTU discovery, and NAT.
    subtopics: [Routing, NAT, ICMP and PMTUD]
    requires: [net-ip]
  - id: net-transport
    title: TCP and UDP
    description: UDP, and a TCP connection from handshake to close.
    subtopics: [UDP, TCP vs UDP, TCP connection lifecycle, TCP keepalive]
    requires: [net-ip]
  - id: net-tcp-performance
    title: TCP performance
    description: Flow and congestion control, retransmission, Nagle and head-of-line blocking.
    subtopics: [TCP flow and congestion control, TCP retransmission, Nagle and delayed ACK, Head-of-line blocking]
    requires: [net-transport]
  - id: net-dns
    title: DNS
    description: Resolution, record types, caching and TTLs.
    subtopics: [DNS]
    requires: [net-transport]
  - id: net-tls
    title: TLS
    description: Handshakes, certificates and what TLS does and does not protect.
    subtopics: [TLS]
    requires: [net-transport]
  - id: net-sockets
    title: Sockets API
    description: The sockets API and its options, and multiplexing many connections.
    subtopics: [Sockets API and options, I/O multiplexing]
    requires: [net-tcp-performance]
    related: [os-files]
  - id: net-http
    title: HTTP
    description: Methods, status codes, caching, HTTP/1.1 connections and WebSockets.
    subtopics: [HTTP semantics, HTTP/1.1, WebSockets]
    requires: [net-dns, net-tls]
  - id: net-http2-quic
    title: HTTP/2 and QUIC
    description: Multiplexed streams, and HTTP/3 over QUIC.
    subtopics: [HTTP/2, HTTP/3 and QUIC]
    requires: [net-http]
  - id: net-load-balancing
    title: Load balancers and CDNs
    description: Layer 4 and layer 7 load balancing, proxies and content delivery networks.
    subtopics: [Load balancing and proxies, CDNs]
    requires: [net-http]
  - id: net-low-latency
    title: Multicast and low latency
    description: Multicast, market data feeds and kernel bypass.
    subtopics: [Multicast, Market data, Kernel bypass and low latency]
    requires: [net-sockets]
  - id: net-debugging
    title: Debugging end to end
    description: What happens when you type a URL, and the tools that show each step.
    subtopics: [Debugging tools, What happens when you type a URL]
    requires: [net-http, net-sockets]

probability:
  - id: prob-counting
    title: Counting and combinatorics
    description: Equally likely outcomes, complements, inclusion-exclusion and reflection counts.
    subtopics: [Counting and combinatorics]
  - id: prob-conditional
    title: Conditional probability
    description: Conditioning on what was observed, Bayes in odds form, base rates and classic paradoxes.
    subtopics: [Conditional probability and Bayes]
    requires: [prob-counting]
  - id: prob-expectation
    title: Expectation and linearity
    description: Indicator variables, tail sums, and what an expected value does and does not tell you.
    subtopics: [Expectation and linearity]
    requires: [prob-counting]
  - id: prob-discrete
    title: Discrete distributions
    description: Binomial, geometric and Poisson variables, thinning, and quick normal approximations.
    subtopics: [Discrete distributions]
    requires: [prob-expectation]
  - id: prob-continuous
    title: Continuous and geometric
    description: Uniforms as areas, exponentials and memorylessness, sampling, and ill-posed "random" choices.
    subtopics: [Continuous distributions and geometric probability]
    requires: [prob-expectation]
  - id: prob-variance
    title: Variance and correlation
    description: Variance of sums and random sums, limits on correlation, and the bivariate normal.
    subtopics: ["Variance, covariance and correlation"]
    requires: [prob-discrete, prob-continuous]
  - id: prob-symmetry
    title: Symmetry and order stats
    description: Exchangeability and relabelling arguments, records and uniform order statistics.
    subtopics: [Symmetry and order statistics]
    requires: [prob-continuous]
  - id: prob-first-step
    title: First-step analysis
    description: Conditioning on the first move, Markov chains on small graphs, waiting times for patterns.
    subtopics: [First-step analysis and Markov chains]
    requires: [prob-conditional, prob-expectation]
  - id: prob-random-walks
    title: Random walks and martingales
    description: Gambler's ruin, hitting times, reflection, Pólya's urn and why fair games stay fair.
    subtopics: [Random walks and martingales]
    requires: [prob-first-step]
  - id: prob-games
    title: Games and optimal stopping
    description: Fair value of games, when to stop, backward induction, Kelly betting and paradoxes.
    subtopics: [Games and optimal stopping]
    requires: [prob-first-step]

brainteasers:
  - id: bt-logic
    title: Logic and deduction
    description: Liars and truth-tellers, hat puzzles, and what people can infer from what others know.
    subtopics: [Logic and deduction]
  - id: bt-weighing
    title: Weighing and measuring
    description: Counterfeit coins, one-weighing tricks, poisoned bottles, jugs, ropes and hourglasses.
    subtopics: [Weighing and measuring]
  - id: bt-invariants
    title: Invariants and colouring
    description: Quantities a move cannot change, parity arguments and colourings that rule out tilings.
    subtopics: ["Invariants, parity and colouring"]
  - id: bt-pigeonhole
    title: Pigeonhole and extremal
    description: More objects than boxes, Ramsey-style arguments, and choosing the best case to force a property.
    subtopics: [Pigeonhole and extremal arguments]
  - id: bt-games
    title: Strategy games
    description: Backward induction, losing positions and Nim, symmetry and strategy-stealing arguments.
    subtopics: [Strategy games and backward induction]
    requires: [bt-logic]
    related: [prob-games]
  - id: bt-worst-case
    title: Optimisation and worst case
    description: Fewest drops, races or comparisons that always suffice, with a matching lower bound.
    subtopics: [Optimisation and worst case]
    requires: [bt-weighing]
  - id: bt-numbers
    title: Number puzzles
    description: Divisibility, digits, clocks and sums where one observation replaces a long computation.
    subtopics: [Number puzzles and quick insight]
  - id: bt-geometry
    title: Geometry and spatial
    description: Unfolding surfaces, limiting cases, angular speed and continuity arguments.
    subtopics: [Geometry and spatial puzzles]
  - id: bt-estimation
    title: Estimation (Fermi)
    description: Breaking an unknown quantity into factors you can estimate, with stated assumptions and a range.
    subtopics: [Estimation and Fermi questions]

betting-market-making:
  - id: bmm-fair-value
    title: Fair value and EV
    description: What a game or contract is worth, who holds the choices in it, and what information is worth.
    subtopics: [Fair value and expected value]
    related: [prob-expectation]
  - id: bmm-mechanics
    title: Market mechanics
    description: Bids, offers and the spread, the order book, crossing the spread, positions and mark-to-market P&L.
    subtopics: [Market mechanics]
  - id: bmm-odds
    title: Odds and arbitrage
    description: Implied probabilities, the bookmaker's margin, value bets, dutching and sure-win books.
    subtopics: ["Odds, margins and arbitrage"]
    requires: [bmm-fair-value]
  - id: bmm-sizing
    title: Bet sizing and Kelly
    description: How much to stake, Kelly and fractional Kelly, drawdowns, utility and risk aversion.
    subtopics: ["Bet sizing, Kelly and risk"]
    requires: [bmm-fair-value]
    related: [prob-games]
  - id: bmm-calibration
    title: Intervals and calibration
    description: Building a confidence interval for an unknown quantity, checking calibration, honest forecasts.
    subtopics: [Confidence intervals and calibration]
  - id: bmm-quoting
    title: Making a market
    description: Choosing a mid and a width, consistency between related markets, and quoting in size.
    subtopics: [Making a two-sided market]
    requires: [bmm-fair-value, bmm-mechanics]
  - id: bmm-adverse-selection
    title: Adverse selection
    description: What a fill tells you, informed flow, moving the market, and managing and hedging the position.
    subtopics: [Adverse selection and updating after trades]
    requires: [bmm-quoting]
    related: [prob-conditional]
  - id: bmm-auctions
    title: Auctions, winner's curse
    description: Conditioning on winning, shading bids, and first- and second-price auctions.
    subtopics: [Auctions and the winner's curse]
    requires: [bmm-adverse-selection]
  - id: bmm-games
    title: Trading games
    description: Markets on hidden cards and dice where information arrives in rounds, with positions tracked as you go.
    subtopics: [Trading games]
    requires: [bmm-adverse-selection]

options:
  - id: opt-forwards
    title: Forwards and carry
    description: Discounting, the forward price by no arbitrage, dividends, currencies, commodities and futures.
    subtopics: ["Forwards, futures and carry"]
  - id: opt-payoffs
    title: Payoffs and strategies
    description: Calls, puts, spreads, straddles and butterflies, reading a payoff and building one from options.
    subtopics: [Payoffs and option strategies]
  - id: opt-parity
    title: Put-call parity
    description: Deriving parity from payoffs, pricing with it, conversions, box spreads and implied forwards.
    subtopics: [Put-call parity]
    requires: [opt-forwards, opt-payoffs]
  - id: opt-bounds
    title: Arbitrage bounds
    description: Bounds on option prices, monotonicity and convexity in strike, and spotting an arbitrage in quotes.
    subtopics: [Static arbitrage bounds]
    requires: [opt-parity]
  - id: opt-binomial
    title: Binomial trees
    description: One- and two-step trees, replication, risk-neutral probabilities and incomplete markets.
    subtopics: [Binomial trees and risk-neutral pricing]
    requires: [opt-parity]
    related: [prob-expectation]
  - id: opt-american
    title: Early exercise
    description: Why American calls on non-dividend stocks are never exercised early, when puts are, and pricing on a tree.
    subtopics: [Early exercise and American options]
    requires: [opt-bounds, opt-binomial]
  - id: opt-black-scholes
    title: Black-Scholes
    description: What the inputs do, quick at-the-money pricing, N(d1) and N(d2), limits and the hedging argument.
    subtopics: [Black-Scholes]
    requires: [opt-binomial]
  - id: opt-greeks
    title: Greeks and hedging
    description: Signs and shapes of the Greeks, delta and gamma hedging, and gamma paid for by theta.
    subtopics: [The Greeks and hedging]
    requires: [opt-black-scholes]
  - id: opt-volatility
    title: Implied and realised vol
    description: Volatility arithmetic, variance over time, the skew, and what a delta-hedged option bets on.
    subtopics: [Implied and realised volatility]
    requires: [opt-greeks]
  - id: opt-stochastic
    title: Brownian motion and Itô
    description: Brownian motion, quadratic variation, Itô's lemma, martingales and changing measure.
    subtopics: [Brownian motion and Itô calculus]
    requires: [opt-binomial]
    related: [prob-random-walks]
  - id: opt-fixed-income
    title: Bonds and duration
    description: Price against yield, duration and convexity, forward rates and callable bonds.
    subtopics: ["Bonds, yields and duration"]
    requires: [opt-forwards]

statistics:
  - id: stat-sampling
    title: Sampling and the CLT
    description: Standard error against standard deviation, when averages settle down, and samples that mislead.
    subtopics: ["Sampling, the law of large numbers and the CLT"]
    related: [prob-discrete]
  - id: stat-estimation
    title: Estimators and likelihood
    description: Bias, variance and MSE, why n - 1, maximum likelihood, method of moments and the German tank.
    subtopics: [Estimators and maximum likelihood]
    requires: [stat-sampling]
    related: [prob-symmetry]
  - id: stat-testing
    title: Intervals and tests
    description: What p-values and confidence levels mean, power and sample size, multiple testing and peeking.
    subtopics: [Confidence intervals and hypothesis tests]
    requires: [stat-sampling]
  - id: stat-bayesian
    title: Bayesian inference
    description: Conjugate updates, sceptical priors, shrinking noisy estimates, and where Bayes and p-values part.
    subtopics: [Bayesian inference and shrinkage]
    requires: [stat-estimation]
    related: [prob-conditional]
  - id: stat-regression
    title: Linear regression
    description: What OLS minimises, its assumptions and failures, R squared, collinearity and omitted variables.
    subtopics: [Linear regression]
    requires: [stat-estimation, stat-testing]
    related: [prob-variance]
  - id: stat-correlation
    title: Correlation and Sharpe
    description: Spurious and fragile correlations, outliers, tail dependence, and Sharpe-ratio arithmetic and error.
    subtopics: [Correlation and the Sharpe ratio]
    requires: [stat-testing]
    related: [prob-variance]
  - id: stat-time-series
    title: Time series
    description: Stationarity, AR(1) and half-lives, unit roots, overlapping data, volatility clustering and scaling.
    subtopics: [Time series]
    requires: [stat-regression, stat-correlation]
    related: [prob-random-walks]
  - id: stat-backtesting
    title: Backtesting and validation
    description: Overfitting, selection across many backtests, look-ahead and survivorship, validation in time.
    subtopics: [Model validation and backtesting]
    requires: [stat-time-series]
  - id: stat-ml
    title: Regularisation and ML
    description: The bias-variance trade-off, ridge and lasso as priors, training-error optimism, simple models.
    subtopics: [Regularisation and model complexity]
    requires: [stat-regression]

algebra-calculus:
  - id: lac-rank
    title: Rank and linear systems
    description: Rank and nullity, when Ax = b has a solution, and the rank of sums, products and outer products.
    subtopics: [Rank and linear systems]
  - id: lac-determinants
    title: Determinants
    description: Determinants as volume, and quick determinants of structured and covariance-like matrices.
    subtopics: [Determinants]
    requires: [lac-rank]
  - id: lac-eigen
    title: Eigenvalues and vectors
    description: Trace and determinant, rank-one and symmetric matrices, powers, diagonalisation and Markov matrices.
    subtopics: [Eigenvalues and eigenvectors]
    requires: [lac-determinants]
    related: [prob-first-step]
  - id: lac-psd
    title: Covariance and PSD matrices
    description: Valid covariance and correlation matrices, Cholesky and correlated normals, singular and repaired estimates.
    subtopics: [Positive semidefinite and covariance matrices]
    requires: [lac-eigen]
    related: [prob-variance]
  - id: lac-least-squares
    title: Projections, least squares
    description: Orthogonal projection, the normal equations, the hat matrix, and what collinearity does to a fit.
    subtopics: [Projections and least squares]
    requires: [lac-eigen]
  - id: lac-svd-pca
    title: SVD, PCA and conditioning
    description: Principal components of returns, low-rank approximation, condition numbers and noisy covariance estimates.
    subtopics: ["SVD, PCA and conditioning"]
    requires: [lac-psd, lac-least-squares]
  - id: lac-limits
    title: Limits and derivatives
    description: Standard limits, logarithmic differentiation, Taylor coefficients and quick approximations such as log returns.
    subtopics: ["Limits, derivatives and approximations"]
  - id: lac-integrals
    title: Integrals
    description: Gamma and Gaussian integrals, integration by parts, substitution, volumes and differentiating under the integral.
    subtopics: [Integrals]
    requires: [lac-limits]
    related: [prob-continuous]
  - id: lac-series
    title: Series and sums
    description: Geometric and telescoping sums, harmonic numbers, convergence tests and swapping the order of summation.
    subtopics: [Series and sums]
    requires: [lac-integrals]
  - id: lac-optimisation
    title: Optimisation and convexity
    description: First- and second-order conditions, Lagrange multipliers, minimum-variance weights, AM-GM and Cauchy-Schwarz.
    subtopics: ["Optimisation, convexity and inequalities"]
    requires: [lac-limits, lac-psd]
  - id: lac-odes
    title: Differential equations
    description: Exponential decay and mean reversion, first-order linear equations and damped oscillations.
    subtopics: [Differential equations]
    requires: [lac-integrals]
