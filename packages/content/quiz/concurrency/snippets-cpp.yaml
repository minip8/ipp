    #include <stdexcept>
    #include <thread>

    int main() {
        std::packaged_task<int(int)> task([](int x) {
            if (x < 0) throw std::invalid_argument("negative");
            return x * 2;
        });
        std::future<int> f = task.get_future();
        std::thread t(std::move(task), -1);
        t.join();
        try {
            std::cout << f.get() << '\n';
        } catch (const std::invalid_argument& e) {
            std::cout << "caught " << e.what() << '\n';
        }
    }
  answer: { kind: output, output: "caught negative" }
  explanation: |
    A `std::packaged_task` wraps a callable and connects it to a future. When the task runs and the
    callable throws, the exception is **captured** (as an `exception_ptr`) into the shared state rather
    than escaping the thread. `f.get()` then rethrows the original exception, with its original type,
    in the thread that calls `get()`.

    Without this, an exception escaping a `std::thread`'s top-level function would call
    `std::terminate()`. Futures are the standard mechanism for moving both results and errors across
    threads.
