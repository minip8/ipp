# Symmetry and order statistics: exchangeability, relabelling arguments, uniform order statistics.
- id: prob-symmetry-001
  topic: probability
  subtopic: Symmetry and order statistics
  type: numeric
  difficulty: easy
  tags: [order-statistics, uniform, symmetry]
  prompt: |
    Four numbers are drawn independently and uniformly from $[0, 1]$. What is the expected value of
    the **second smallest**?
  answer: 2/5
  explanation: |
    $n$ uniform points split $[0, 1]$ into $n + 1$ gaps, and by symmetry every gap has the same
    expected length, $\frac{1}{n+1}$. The $k$-th smallest point sits after $k$ gaps, so its expected
    value is $\frac{k}{n+1}$. With $n = 4$ and $k = 2$ that is $\frac{2}{5}$.

    (The $k$-th order statistic of $n$ uniforms has the Beta$(k, n+1-k)$ distribution, whose mean
    is the same $\frac{k}{n+1}$.) The common wrong answer is $\frac{2}{4} = \frac12$, which divides
    by $n$ instead of $n + 1$, as if the largest point were always at 1.
  source: { name: "Uniform order statistics (e.g. Zhou, ch. 4)" }

- id: prob-symmetry-002
  topic: probability
  subtopic: Symmetry and order statistics
  type: numeric
  difficulty: medium
  tags: [airplane-seat, symmetry, recursion]
  prompt: |
    100 passengers board a plane with 100 seats, one at a time, each with an assigned seat. The first
    passenger has lost their boarding pass and sits in a seat chosen uniformly at random. Every later
    passenger sits in their own seat if it is free, and otherwise in a seat chosen uniformly at random
    from those still free. What is the probability that the last passenger sits in their own seat?
  answer: 1/2
  hints:
    - Try 2 and 3 passengers.
    - Which seats can the last passenger end up in?
    - Whenever someone has to choose at random, how do the first passenger's seat and the last passenger's seat compare?
  followUps:
    - What is the probability that the 50th passenger gets their own seat?
    - What is the expected number of passengers who do not sit in their own seat?
  explanation: |
    The last passenger ends up in either their own seat or the first passenger's seat: any other
    seat $k$ would have been taken by passenger $k$ when they boarded, if not before. Every time
    someone chooses at random, the first passenger's seat and the last passenger's seat are both
    free and treated identically, and the process is decided at the first random choice that picks
    one of them. Picking the first passenger's seat restores order (everyone else sits correctly);
    picking the last's dooms them. By symmetry each is equally likely, so the probability is
    $1/2$.

    The common wrong answers are $1/100$ (as if the last passenger got a random seat) and "close to
    1" (as if only the first passenger's choice mattered).
  source: { name: "Airplane seating puzzle (folklore; widely asked)" }

- id: prob-symmetry-003
  topic: probability
  subtopic: Symmetry and order statistics
  type: numeric
  difficulty: medium
  tags: [cards, symmetry, relative-order]
  prompt: |
    A standard deck is shuffled uniformly. What is the probability that all four aces appear before
    any of the four kings?
  answer: 1/70
  hints:
    - The other 44 cards are irrelevant to the question.
    - Look only at the relative order of the eight aces and kings.
  followUps:
    - What is the probability that the first ace appears before the first king?
    - What is the probability that the aces and kings alternate?
  explanation: |
    Only the relative order of the eight aces and kings matters, and by symmetry each of the
    $\binom{8}{4} = 70$ patterns of "which of the eight positions are aces" is equally likely. Exactly
    one of them (AAAAKKKK) has all aces first, so the answer is $\frac{1}{70}$. Equivalently,
    $\frac{4}{8} \cdot \frac{3}{7} \cdot \frac{2}{6} \cdot \frac{1}{5}$, drawing the eight relevant
    cards one at a time.

    The common wrong answers come from trying to handle all 52 cards: $\left(\tfrac12\right)^4$
    (treating each ace-king comparison as an independent coin flip) or $\tfrac12$ (confusing the
    question with "the first ace before the first king").
  source: { name: "Classic card-ordering problem" }

- id: prob-symmetry-004
  topic: probability
  subtopic: Symmetry and order statistics
  type: numeric
  difficulty: hard
  tags: [cards, symmetry, insertion]
  prompt: |
    A standard deck is shuffled uniformly and cards are turned over until the first ace appears. What
    is the probability that the **next** card is the ace of spades?
  answer: 1/52
  hints:
    - Remove the ace of spades from the deck and shuffle the other 51 cards. How can you put it back so that the 52-card deck is uniform?
    - Where must it go for the event to happen?
  followUps:
    - What is the probability that the next card is the king of hearts?
    - These answers are equal. Why is that surprising, given that the next card is more often a non-ace?
  explanation: |
    Build the shuffled deck in two steps: shuffle the 51 cards other than the ace of spades, then
    insert the ace of spades into one of the 52 possible positions uniformly at random. The result
    is a uniform shuffle of 52 cards. The event happens exactly when the ace of spades is inserted
    immediately after the first ace of the 51-card deck (one of its three other aces), which is one
    position out of 52. So the probability is $\frac{1}{52}$.

    (If the ace of spades is put earlier, it becomes the first ace itself and the next card is not
    it.) The same argument gives $\frac{1}{52}$ for any specific card, the king of hearts included.
    The common wrong answers are $\frac{3}{51}$ or $\frac{1}{51}$, from treating "the next card" as
    a uniformly random one of the remaining cards and forgetting the ace of spades may already be
    the first ace.
  source: { name: "Classic card puzzle (folklore)" }

- id: prob-symmetry-005
  topic: probability
  subtopic: Symmetry and order statistics
  type: numeric
  difficulty: hard
  tags: [order-statistics, range, uniform]
  prompt: |
    Three numbers are drawn independently and uniformly from $[0, 1]$. What is the probability that
    the largest and the smallest differ by at most $1/3$?
  answer: 7/27
  answerText: |-
    $7/27 \approx 0.259$
  hints:
    - Condition on which of the three is the smallest, and on its value $m$.
    - Given the minimum is $m$, the other two lie in $[m, 1]$. When are they both within $1/3$ of $m$?
    - Be careful near the right end, where $m + 1/3 > 1$.
  followUps:
    - What is the answer for $n$ points and a range of at most $r$?
    - What is the expected range of $n$ uniform points?
  explanation: |
    Condition on the minimum. One of the three is the minimum (3 choices), at value $m$, and the
    other two must both lie in $[m, m + r]$, with $r = 1/3$. While $m \le 1 - r$ that has probability
    $r^2$ per value of $m$; beyond that the whole of $[m, 1]$ qualifies. So

    $$P = 3\int_0^{1-r} r^2\,dm + 3\int_{1-r}^{1}(1 - m)^2\,dm = 3r^2(1 - r) + r^3 = 3r^2 - 2r^3.$$

    With $r = \frac13$: $\frac{3}{9} - \frac{2}{27} = \frac{7}{27}$. In general, for $n$ points,
    $P(\text{range} \le r) = n r^{n-1} - (n - 1) r^n$.

    The common slip is to stop at $3r^2 = \frac13$, ignoring that near the right end there is less
    room, or to write $r^2$ (forgetting that any of the three can be the minimum).
  source: { name: "Range of uniform order statistics (e.g. Ross, A First Course in Probability)" }

- id: prob-symmetry-006
  topic: probability
  subtopic: Symmetry and order statistics
  type: single
  difficulty: medium
  tags: [dice, order-statistics, expectation]
  prompt: |
    Two fair dice are rolled. Which has the larger expected value: the **smaller** of the two numbers,
    or the **absolute difference** between them?
  choices:
    - { id: a, text: "The smaller number" }
    - { id: b, text: "The absolute difference" }
    - { id: c, text: "They are equal" }
  answer: a
  explanation: |
    By the tail sum, $E[\min] = \sum_{k=1}^{6} P(\min \ge k) = \sum_{k=1}^{6} \left(\tfrac{7-k}{6}\right)^2
    = \frac{36 + 25 + 16 + 9 + 4 + 1}{36} = \frac{91}{36} \approx 2.53$.

    For the difference, a gap of $d \ge 1$ occurs in $2(6 - d)$ of the 36 outcomes, so
    $E|X - Y| = \frac{2(5 \cdot 1 + 4 \cdot 2 + 3 \cdot 3 + 2 \cdot 4 + 1 \cdot 5)}{36} = \frac{70}{36}
    \approx 1.94$.

    So the smaller number wins. A quick consistency check: $E[\max] + E[\min] = 7$ and
    $E[\max] - E[\min] = E|X - Y|$, so $E|X - Y| = 7 - 2E[\min]$. Choice c is a guess that the two
    are "the same kind of quantity"; b comes from overestimating how often the dice are far apart.
  source: { name: "Widely reported interview question (Glassdoor)" }

- id: prob-symmetry-007
  topic: probability
  subtopic: Symmetry and order statistics
  type: short
  difficulty: medium
  tags: [coins, symmetry, binomial]
  prompt: |
    Alice tosses 11 fair coins and Bob tosses 10. What is the probability that Alice gets **more
    heads** than Bob? Explain without heavy computation.
  reference: |
    The answer is $1/2$.

    Set Alice's last coin aside and compare her first 10 coins with Bob's 10. Let $A$ and $B$ be the
    heads in those. By symmetry $P(A > B) = P(A < B) = p$ and $P(A = B) = 1 - 2p$. With the extra coin:

    - if $A > B$ Alice already has more heads, whatever the extra coin;
    - if $A < B$ she cannot get more, since one coin adds at most 1;
    - if $A = B$ she has more exactly when the extra coin is heads, probability $1/2$.

    So $P = p + \tfrac12(1 - 2p) = \tfrac12$.

    A slicker version: Alice has more heads than Bob, or else she has more tails than Bob (her 11
    coins cannot tie Bob's 10 on both), and exactly one of these holds. By symmetry between heads and
    tails the two have equal probability, so each is $1/2$.
  keyPoints:
    - The answer is 1/2
    - Compares the first 10 of Alice's coins with Bob's 10 and uses symmetry between them
    - Handles the three cases (ahead, behind, tied) and the role of the extra coin
    - Or the heads/tails complementary argument that exactly one of "more heads" and "more tails" holds
  hints:
    - Set Alice's eleventh coin aside for a moment.
    - What are the three possibilities for her first 10 coins against Bob's 10?
  followUps:
    - What if Alice tosses $n + 2$ coins and Bob $n$?
    - What if the coins are biased, with probability $p$ of heads?
  explanation: |
    Candidates who start summing binomial products get stuck; the interviewer is looking for the
    symmetry. The heads/tails argument is especially neat because it explains why the answer does
    not depend on $n$ and why it needs the extra coin: with equal numbers of coins, ties make the
    answer less than $1/2$.
  source: { name: "Classic symmetry problem (e.g. Zhou, ch. 4)" }

- id: prob-symmetry-008
  topic: probability
  subtopic: Symmetry and order statistics
  type: short
  difficulty: hard
  tags: [records, exchangeability, harmonic-numbers]
  prompt: |
    $X_1, X_2, \dots, X_n$ are independent with the same continuous distribution. Call $X_k$ a
    **record** if it is larger than all of $X_1, \dots, X_{k-1}$ ($X_1$ is always a record). What is
    the probability that $X_k$ is a record, and what is the expected number of records among the
    $n$? Roughly how many records would you expect in 1,000 days of a stationary daily
    temperature series?
  reference: |
    The first $k$ values are exchangeable and ties have probability 0, so each of them is equally
    likely to be the largest: $P(X_k \text{ is a record}) = \frac{1}{k}$, whatever the distribution.

    With indicators and linearity,

    $$E[\text{records}] = \sum_{k=1}^{n} \frac1k = H_n \approx \ln n + 0.577.$$

    For $n = 1000$, $H_{1000} \approx 7.5$: only seven or eight records in 1,000 days if nothing is
    changing. Records get rarer roughly like $1/k$, so a sustained excess of records over $H_n$ is
    evidence of a trend.
  keyPoints:
    - P(X_k is a record) = 1/k by exchangeability of the first k values
    - The answer does not depend on the distribution, only that it is continuous (no ties)
    - Expected number of records is the harmonic number H_n by linearity
    - H_n is about ln n + 0.577, so about 7.5 for n = 1000
  hints:
    - Among the first $k$ values, which is most likely to be the largest?
    - Write the number of records as a sum of indicators.
  followUps:
    - Are the record indicators independent?
    - What is the expected number of cycles in a random permutation of $n$, and why is it the same?
  explanation: |
    The idea is exchangeability: no position among the first $k$ is special, so the largest is
    equally likely to be any of them. Candidates often think records come at a steady rate, or that
    the answer depends on the distribution. The follow-up has a nice answer: the record indicators
    are in fact independent, which is what makes the variance $\sum \frac1k(1 - \frac1k)$.
  source: { name: "Record values (Rényi; e.g. Blitzstein and Hwang, ch. 4)" }
