# Series and sums: geometric and telescoping sums, harmonic numbers, convergence tests, swapping the order of summation.
- id: lac-series-001
  topic: algebra-calculus
  subtopic: Series and sums
  type: numeric
  difficulty: easy
  tags: [geometric-series, arithmetico-geometric, expectation]
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty} \frac{n}{2^n}$.
  answer: 2
  explanation: |
    Let $S = \sum n/2^n$. Subtract half of it, shifting the index:

    $$S - \tfrac12 S = \sum_{n \ge 1} \frac{n - (n - 1)}{2^n} = \sum_{n \ge 1} \frac{1}{2^n} = 1 \quad\Longrightarrow\quad S = 2.$$

    Two other routes: differentiate the geometric series, $\sum n x^n = \frac{x}{(1 - x)^2}$, at
    $x = \tfrac12$; or recognise $S$ as the mean of a geometric variable (the number of fair coin tosses
    up to and including the first head), which is 2.

    The common slip is to answer 1, the sum of $1/2^n$, by dropping the factor $n$.
  source: { name: "Standard series (e.g. Zhou, A Practical Guide to Quantitative Finance Interviews)" }

- id: lac-series-002
  topic: algebra-calculus
  subtopic: Series and sums
  type: numeric
  difficulty: easy
  tags: [telescoping, partial-fractions, finite-sum]
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{99} \frac{1}{n(n + 1)}$.
  answer: 99/100
  answerText: |-
    $99/100 = 0.99$
  explanation: |
    Partial fractions turn it into a telescoping sum:

    $$\frac{1}{n(n + 1)} = \frac1n - \frac{1}{n + 1}, \qquad \sum_{n=1}^{99}\left(\frac1n - \frac{1}{n+1}\right) = 1 - \frac{1}{100} = \frac{99}{100}.$$

    The common slip is to answer 1, the value of the infinite series, ignoring that the sum stops at 99.
  source: { name: "Standard telescoping sum" }

- id: lac-series-003
  topic: algebra-calculus
  subtopic: Series and sums
  type: numeric
  difficulty: medium
  tags: [riemann-sum, harmonic-numbers, limits]
  prompt: |
    Evaluate $\displaystyle\lim_{n \to \infty} \sum_{k=n+1}^{2n} \frac{1}{k}$ to three significant
    figures.
  answer: 0.693147
  answerText: |-
    $\ln 2 \approx 0.693$
  hints:
    - Factor out $\frac1n$ and write each term as a function of $k/n$.
    - The sum is then a Riemann sum for an integral over $[0, 1]$.
  followUps:
    - What is the limit of $\sum_{k=n+1}^{3n} \frac1k$?
    - A random permutation of $n$ elements has at most one cycle longer than $n/2$. Use this limit to estimate the probability that it has one.
  explanation: |
    Write $k = n + j$ for $j = 1, \dots, n$:

    $$\sum_{j=1}^{n} \frac{1}{n + j} = \frac1n\sum_{j=1}^{n} \frac{1}{1 + j/n} \to \int_0^1 \frac{dx}{1 + x} = \ln 2 \approx 0.693.$$

    Equivalently, $H_{2n} - H_n \approx \ln(2n) - \ln n = \ln 2$, since $H_m = \ln m + \gamma + o(1)$.

    Common wrong answers: 0 (each term tends to 0, but there are $n$ of them) and $\infty$ (there are
    $n$ terms, but each is at most $\frac1n$). The sum is squeezed between $\tfrac12$ and 1, which is a
    quick sanity check. For the follow-up: the probability of a cycle longer than $n/2$ is
    $\sum_{k > n/2} \frac1k \to \ln 2$.
  source: { name: "Quant, FM and Data Science Interview Compilation (LSU)", url: "https://www.math.lsu.edu/~smolinsk/Quant_Interview_Prep.pdf" }

- id: lac-series-004
  topic: algebra-calculus
  subtopic: Series and sums
  type: multiple
  difficulty: hard
  tags: [convergence-tests, comparison-test, ratio-test]
  prompt: |
    Which of these series converge? Select all that apply.
  choices:
    - { id: a, text: '$\displaystyle\sum_{n \ge 2} \frac{1}{n \ln n}$' }
    - { id: b, text: '$\displaystyle\sum_{n \ge 1} \frac{(-1)^{n+1}}{n}$' }
    - { id: c, text: '$\displaystyle\sum_{n \ge 1} \frac{1}{n^{1 + 1/n}}$' }
    - { id: d, text: '$\displaystyle\sum_{n \ge 1} \frac{n!}{n^n}$' }
    - { id: e, text: '$\displaystyle\sum_{n \ge 1} \sin\frac1n$' }
    - { id: f, text: '$\displaystyle\sum_{n \ge 2} \frac{1}{(\ln n)^{\ln n}}$' }
  answer: [b, d, f]
  explanation: |
    - **a, diverges.** By the integral test, $\int \frac{dx}{x\ln x} = \ln\ln x \to \infty$, though
      extremely slowly. The extra $\ln n$ is not enough to beat $\frac1n$.
    - **b, converges** (to $\ln 2$), by the alternating series test, though not absolutely.
    - **c, diverges.** Every exponent exceeds 1, but $n^{1/n} \to 1$, and $n^{1/n} \le e^{1/e} < 2$ for
      all $n$, so the terms exceed $\frac{1}{2n}$. The $p$-test needs one fixed $p > 1$; an exponent that
      creeps down to 1 does not count. This is the trap in the list.
    - **d, converges.** By the ratio test, $\frac{a_{n+1}}{a_n} = \left(\frac{n}{n+1}\right)^n \to \frac1e < 1$.
    - **e, diverges.** $\sin\frac1n \sim \frac1n$, so it behaves like the harmonic series (limit
      comparison). Terms tending to 0 is necessary, not sufficient.
    - **f, converges.** $(\ln n)^{\ln n} = e^{\ln n \cdot \ln\ln n} = n^{\ln\ln n}$, and $\ln\ln n \ge 2$ once
      $n \ge e^{e^2} \approx 1618$, so the terms are eventually at most $\frac{1}{n^2}$.

    The usual mistakes are a (a logarithm "should" help), c (the exponent is always above 1) and e
    (the terms go to zero).
  source: { name: "Standard convergence tests (e.g. Spivak, Calculus)" }

- id: lac-series-005
  topic: algebra-calculus
  subtopic: Series and sums
  type: numeric
  difficulty: medium
  tags: [basel-problem, series-manipulation, odd-terms]
  prompt: |
    Given that $\sum_{n \ge 1} 1/n^2 = \pi^2/6$, evaluate

    $$1 + \frac{1}{3^2} + \frac{1}{5^2} + \frac{1}{7^2} + \cdots$$

    to three significant figures.
  answer: 1.233701
  answerText: |-
    $\pi^2/8 \approx 1.23$
  hints:
    - Split the full sum into odd and even terms.
    - How is the sum of the even terms related to the full sum?
  followUps:
    - What is $1 - \frac{1}{2^2} + \frac{1}{3^2} - \frac{1}{4^2} + \cdots$?
    - Given $\sum 1/n^4 = \pi^4/90$, what is the sum over odd $n$ of $1/n^4$?
  explanation: |
    The even terms are $\sum_{m \ge 1} \frac{1}{(2m)^2} = \frac14 \cdot \frac{\pi^2}{6}$, a quarter of
    the whole. So the odd terms are the other three quarters:

    $$\sum_{n \text{ odd}} \frac{1}{n^2} = \frac34 \cdot \frac{\pi^2}{6} = \frac{\pi^2}{8} \approx 1.234.$$

    Common wrong answers: $\pi^2/12 \approx 0.822$ (assuming the odd terms are half the sum, when the
    odd terms are the larger ones) and $\pi^2/24$ (the even terms). The alternating sum in the
    follow-up is odd minus even, $\frac{\pi^2}{8} - \frac{\pi^2}{24} = \frac{\pi^2}{12}$.
  source: { name: "Standard series manipulation (Basel problem)" }

- id: lac-series-006
  topic: algebra-calculus
  subtopic: Series and sums
  type: short
  difficulty: medium
  tags: [harmonic-numbers, integral-test, asymptotics]
  prompt: |
    Show that the harmonic sum $H_n = 1 + \frac12 + \cdots + \frac1n$ grows like $\ln n$ by bounding
    it above and below with integrals. Use this to estimate $H_{1000}$, and roughly how many terms are
    needed before the sum exceeds 20.
  reference: |
    Since $1/x$ is decreasing, on each unit interval

    $$\int_k^{k+1} \frac{dx}{x} \le \frac1k \le \int_{k-1}^{k} \frac{dx}{x} \quad (k \ge 2).$$

    Summing the left inequality over $k = 1, \dots, n$ and the right one over $k = 2, \dots, n$ (plus the
    first term 1):

    $$\ln(n + 1) \le H_n \le 1 + \ln n.$$

    So $H_n$ grows like $\ln n$ and the harmonic series diverges. Sharper: $H_n - \ln n$ decreases to
    Euler's constant $\gamma \approx 0.5772$, with error about $\frac{1}{2n}$.

    $H_{1000} \approx \ln 1000 + 0.577 = 6.908 + 0.577 \approx 7.485$ (the true value is $7.4855$); the
    crude bounds alone give $6.909 \le H_{1000} \le 7.908$.

    To exceed 20 you need $\ln n + \gamma > 20$, so $n \approx e^{19.42} \approx 2.7 \times 10^8$:
    hundreds of millions of terms. The series diverges, but very slowly.
  keyPoints:
    - Compares 1/k with the integral of 1/x over a unit interval on each side, using that 1/x is decreasing
    - Gets ln(n + 1) ≤ Hₙ ≤ 1 + ln n, so Hₙ grows like ln n and the series diverges
    - States that Hₙ − ln n tends to Euler's constant γ ≈ 0.577 and estimates H₁₀₀₀ ≈ 7.49
    - Estimates the number of terms to pass 20 as about e^19.4, a few hundred million
  hints:
    - Draw rectangles of width 1 and height $1/k$ against the curve $y = 1/x$.
    - Which integral do the rectangles approximate from above, and which from below?
  followUps:
    - Where do harmonic numbers appear in probability puzzles?
    - How fast does $H_n - \ln n - \gamma$ tend to zero?
    - Does $\sum 1/p$ over the primes converge?
  explanation: |
    The integral comparison is the standard argument and the interviewer expects both bounds. Many
    candidates know "$H_n \approx \ln n$" but not that the constant is about $0.58$, which matters for
    a numerical estimate. Harmonic numbers appear in the coupon collector ($nH_n$ draws), the expected
    number of records in $n$ observations ($H_n$) and the expected number of cycles of a random
    permutation ($H_n$). The sum over primes also diverges, like $\ln\ln n$.
  source: { name: "Standard integral-test estimate (e.g. Graham, Knuth and Patashnik, Concrete Mathematics)" }

- id: lac-series-007
  topic: algebra-calculus
  subtopic: Series and sums
  type: numeric
  difficulty: hard
  tags: [harmonic-numbers, order-of-summation, generating-functions]
  prompt: |
    With $H_n = 1 + \frac12 + \cdots + \frac1n$, evaluate $\displaystyle\sum_{n=1}^{\infty} \frac{H_n}{2^n}$
    to three significant figures.
  answer: 1.38629
  answerText: |-
    $2\ln 2 \approx 1.39$
  hints:
    - Write $H_n = \sum_{k \le n} \frac1k$ and swap the order of summation.
    - You will need $\sum_{k \ge 1} \frac{x^k}{k} = -\ln(1 - x)$.
  followUps:
    - Find $\sum_{n \ge 1} H_n x^n$ for $|x| < 1$ in closed form.
    - A fair coin is tossed until the first head; $N$ is the number of tosses. What is $E[H_N]$?
  explanation: |
    Swap the order, which is allowed because every term is positive:

    $$\sum_{n \ge 1} \frac{1}{2^n}\sum_{k=1}^{n} \frac1k = \sum_{k \ge 1} \frac1k \sum_{n \ge k} \frac{1}{2^n} = \sum_{k \ge 1} \frac1k \cdot \frac{2}{2^k} = 2\sum_{k \ge 1} \frac{(1/2)^k}{k} = 2\ln 2 \approx 1.386.$$

    The generating-function version: $\sum H_n x^n = \frac{-\ln(1 - x)}{1 - x}$, since multiplying a
    series by $\frac{1}{1 - x}$ replaces its coefficients by their partial sums. At $x = \tfrac12$ this
    is $2\ln 2$. The follow-up about the coin is the same sum: $P(N = n) = 2^{-n}$.

    Common wrong answers: $\ln 2$ (dropping the factor 2 from the tail $\sum_{n \ge k} 2^{-n} = 2^{1-k}$)
    and 2 (replacing $H_n$ by $n$, or by 1).
  source: { name: "Standard generating-function exercise (e.g. Graham, Knuth and Patashnik, Concrete Mathematics)" }
