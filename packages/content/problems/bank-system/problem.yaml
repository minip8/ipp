slug: bank-system
title: Simple Bank System
difficulty: easy
tags: [design, array, simulation]
signature:
  className: Bank
  kind: design
  ctorParams:
    - { name: balance, type: { array: long } }
  methods:
    - name: transfer
      params:
        - { name: fromAccount, type: int }
        - { name: toAccount, type: int }
        - { name: amount, type: long }
      returns: bool
    - name: deposit
      params:
        - { name: account, type: int }
        - { name: amount, type: long }
      returns: bool
    - name: withdraw
      params:
        - { name: account, type: int }
        - { name: amount, type: long }
      returns: bool
    - name: getBalance
      params:
        - { name: account, type: int }
      returns: long
limits: { timeMs: 1000, memoryMb: 256 }
source:
  name: Simple Bank System (LeetCode 2043); bank/account simulations are a common phone-screen design warm-up
  url: https://leetcode.com/problems/simple-bank-system/
